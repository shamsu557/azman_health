<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | Azman University HealthConnect</title><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/recovery-pages.css"></head><body><header><div><a href="/"><img src="/assets/images/logo.svg" alt="Azman University HealthConnect"></a></div></header><main><section class="recovery-card"><a class="secondary back-link" href="/">← Back to sign in</a><h1>Reset your password</h1><p>Use your registered security question and answer. Administrators must use their offline recovery code. <a href="/admin/password">Administrator password recovery</a>.</p><form id="lookup"><label>Email, registration number or SPN<input class="field" id="login" required autocomplete="username"></label><button class="primary">Continue</button></form><form id="reset" class="hidden"><p id="question"></p><label>Security answer<input class="field" id="answer" required autocomplete="off"></label><label>New password (at least 6 characters)<input class="field" id="password" type="password" minlength="6" required autocomplete="new-password"></label><button class="primary">Reset password</button></form><p id="notice" role="status"></p></section></main><script src="/assets/js/recovery.js"></script></body></html>
